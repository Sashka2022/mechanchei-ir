<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{ --blue:#0048FF; --purple:#6536EA; --white:#FEFEFE; --soft:#F3F6FF; --ink:#0B1440; --ink-dim:#4A5580; --line:#DCE3F5; }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Heebo',sans-serif;color:var(--ink);}
    .card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:22px;cursor:pointer;transition:all .2s ease;}
    .card:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(11,20,64,.08);}
  </style>
</helmet>
<div dir="rtl" style="width:1440px;min-height:900px;background:var(--soft);display:flex;flex-direction:column;">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 48px;background:var(--white);border-bottom:1px solid var(--line);">
    <div style="display:flex;align-items:center;gap:14px;">
      <img src="hotam-logo-hebrew.png" style="height:30px;" alt="חותם">
      <div style="width:1px;height:24px;background:var(--line);"></div>
      <div style="font-size:16px;font-weight:800;">גיוס שותפים — מיפוי בעלי עניין</div>
    </div>
    <div style="font-size:13px;font-weight:700;color:var(--ink-dim);">שלב 2 · תכנון וכלים יזמיים</div>
  </div>

  <div style="padding:20px 48px 0;font-size:14px;color:var(--ink-dim);max-width:760px;">
    לחיצה על כרטיס גורם מקדמת את סטטוס הקשר. מיפוי הגורמים העירוניים שיכולים לתמוך במיזם.
  </div>

  <div style="padding:24px 48px 48px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;">
    <sc-for list="{{stakeholders}}" as="s" hint-placeholder-count="7">
      <div class="card" onClick="{{s.advance}}">
        <div style="width:40px;height:40px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;margin-bottom:14px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
        </div>
        <div style="font-size:15px;font-weight:800;margin-bottom:6px;">{{s.name}}</div>
        <div style="font-size:12px;color:var(--ink-dim);margin-bottom:16px;line-height:1.5;">{{s.desc}}</div>
        <div style="display:inline-flex;font-size:11px;font-weight:700;border-radius:999px;padding:5px 12px;color:{{s.color}};background:{{s.bg}};">{{s.status}}</div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var order = ['טרם פנינו','בתהליך יצירת קשר','שותפים פעילים'];
    var base = [
      { name:'אגף הרווחה', desc:'תמיכה בליווי משפחות ותלמידים בסיכון.' },
      { name:'אגף התרבות', desc:'שיתופי פעולה בתחום החינוך הבלתי פורמלי.' },
      { name:'שפ"ח', desc:'שירות פסיכולוגי חינוכי — תמיכה רגשית.' },
      { name:'מתי"א', desc:'מרכז תמיכה ייעוץ למוסדות חינוך.' },
      { name:'עיריית חיפה', desc:'מנהל החינוך העירוני ומדיניות.' },
      { name:'הרשות לקליטת עלייה', desc:'תמיכה בילדי עולים ומשפחותיהם.' },
      { name:'ועדת החינוך', desc:'זירת מדיניות ותקצוב עירוני.' }
    ];
    var statuses = this.state.statuses || {0:1, 4:2};

    function styleFor(idx){
      if (idx === 2) return { color:'#1E9E6B', bg:'#E6F7EF' };
      if (idx === 1) return { color:'#B8860B', bg:'#FBF3DC' };
      return { color:'var(--ink-dim)', bg:'#EEF1FA' };
    }

    var stakeholders = base.map(function(b, i){
      var st = statuses[i] != null ? statuses[i] : 0;
      var sty = styleFor(st);
      return {
        name: b.name, desc: b.desc, status: order[st], color: sty.color, bg: sty.bg,
        advance: function(){
          var next = Object.assign({}, statuses);
          next[i] = (st + 1) % 3;
          self.setState({statuses: next});
        }
      };
    });

    return { stakeholders: stakeholders };
  }
}
</script>
</body>
</html>
