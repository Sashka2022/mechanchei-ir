<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0">
<title>מחנכי עיר מפצחים כאב בטן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* פריסה: דף אפור-חותם ומסגרות מעוגלות. שוליים = רווח = רדיוס (18px). שלוש צורות: מסגרת, עיגול, חץ. */
:root{
  --page:#f0f0f0;      /* צבע הדף, לא לבן */
  --frame:#ffffff;     /* מסגרת לבנה */
  --blue:#0046ff;      /* כחול חותם: מוביל וגם צבע הטקסט */
  --blue2:#3c5af0;     /* תכלת כהה */
  --purple:#6437eb;    /* סגול חותם */
  --sky:#0fb4f5;       /* אקסנט בלבד, בלי מילים */
  --turq:#23d7cd;      /* אקסנט בלבד, בלי מילים */
  --on:#f0f0f0;        /* טקסט על מילוי צבעוני */
  --R:22px;
  --pad:36px;
  --font:'Rubik','Segoe UI',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--blue);font:400 17px/1.55 var(--font);margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul,ol{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
[hidden]{display:none!important}
#app{max-width:1380px;margin:0 auto;padding:var(--R);display:flex;flex-direction:column;gap:var(--R)}
.fr{background:var(--frame);border-radius:var(--R);padding:var(--pad);min-width:0}
.fr.blue{background:var(--blue);color:var(--on)}
.fr.purple{background:var(--purple);color:var(--on)}
.fr.deep{background:var(--blue2);color:var(--on)}
.fr.tight{padding:18px 22px}
.stack{display:flex;flex-direction:column;gap:var(--R);min-width:0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.hint{font-size:15px;opacity:.82}
.h-xl{font-weight:900;letter-spacing:-.01em;line-height:1}
h2.t{font-size:clamp(28px,4vw,44px);font-weight:900;letter-spacing:-.01em;line-height:1.02}
h3.s{font-size:24px;font-weight:700;line-height:1.2}
.lede{font-size:20px;line-height:1.5}
.ic{display:inline-block;flex:0 0 auto}

/* ---- topbar ---- */
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 22px}
.top .logo{width:max(88px,calc(4 * var(--R)));height:auto}
.top .name{font-weight:800;font-size:20px;letter-spacing:-.01em;flex:1 1 240px;min-width:min(240px,100%)}
.top .name small{display:block;font-weight:400;font-size:13px;opacity:.8;margin-top:-3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--page);border-radius:999px;padding:5px 14px;font-size:14px;font-weight:500;max-width:100%;overflow-wrap:anywhere}
.chip b{font-weight:700}
.timer{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;background:var(--page);border-radius:999px;padding:5px 8px 5px 16px}
.timer .t{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;min-width:64px;text-align:center;direction:ltr}
.timer.low{background:var(--purple);color:var(--on)}
.tbtn{width:34px;height:34px;border-radius:50%;border:0;background:var(--frame);color:var(--blue);font-weight:700;font-size:18px;display:grid;place-items:center;padding:0}
.timer.low .tbtn{background:var(--on);color:var(--purple)}
.tbtn:hover{background:var(--blue);color:var(--on)}

/* ---- layout ---- */
.main{display:grid;grid-template-columns:292px minmax(0,1fr);gap:var(--R);align-items:start}
.side{position:sticky;top:var(--R);padding:20px 16px;max-height:calc(100vh - 2*var(--R));overflow-y:auto}
.grp{font-size:13px;font-weight:700;margin:18px 10px 6px;opacity:.8;letter-spacing:.02em}
.grp:first-child{margin-top:0}
.sb{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:14px;padding:10px;text-align:start;font-weight:500;font-size:16px;line-height:1.25}
.sb:hover{background:var(--page)}
.sb .nm{flex:1}
.sb .badge{width:34px;height:34px;border-radius:50%;background:var(--page);display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 34px}
.sb.done .badge{background:var(--blue)}
.sb.cur{background:var(--blue);color:var(--on)}
.sb.cur .badge{background:var(--on);color:var(--blue)}
.sb.cur.done .badge{background:var(--on)}
.pin{font-size:13px;font-weight:700;background:var(--purple);color:var(--on);border-radius:999px;padding:1px 9px;white-space:nowrap}
.prog{height:8px;border-radius:99px;background:var(--page);overflow:hidden;margin:0 10px 8px}
.prog i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}

/* ---- hero ---- */
.stack{container-type:inline-size}
.hero{display:grid;grid-template-columns:1fr;gap:var(--R)}
.hero .copy{padding:44px 40px 84px;position:relative;display:flex;flex-direction:column;gap:22px;justify-content:center;min-height:360px}
.hero h1{font-size:clamp(42px,10.5cqi,92px);line-height:.98;letter-spacing:-.015em}
.hero h1 span{display:block}
@container (min-width:900px){.hero{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}.hero h1{font-size:clamp(40px,6.2cqi,80px)}}
.hero h1 .a{font-weight:900}
.hero h1 .b{font-weight:400}
.hero .photo{border-radius:var(--R);overflow:hidden;min-height:260px;background:var(--blue2)}
.hero .photo img{width:100%;height:100%;object-fit:cover}
.dot{position:absolute;inset-inline-end:22px;bottom:-30px;width:140px;height:140px;border-radius:50%;background:var(--purple);color:var(--on);display:grid;place-items:center;text-align:center;font-weight:800;font-size:17px;line-height:1.2;padding:22px;transform:rotate(-15deg)}
.quote{font-size:clamp(22px,2.6vw,30px);font-weight:700;line-height:1.25}

/* ---- step page ---- */
.sh{display:flex;gap:18px;align-items:flex-start}
.sh .num{flex:0 0 64px;height:64px;border-radius:50%;background:var(--blue);display:grid;place-items:center}
.sh .eyebrow{font-size:14px;font-weight:700;margin-bottom:4px}
.sh .eyebrow.ext{display:inline-block;background:var(--purple);color:var(--on);border-radius:999px;padding:2px 12px}
.sh p{margin-top:8px;font-size:19px}
.guide{background:var(--page);border-radius:var(--R);padding:20px 24px}
.guide summary{cursor:pointer;font-weight:700;font-size:18px;list-style:none;display:flex;align-items:center;gap:10px}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:'';margin-inline-start:auto;width:10px;height:10px;border-inline-end:3px solid var(--blue);border-bottom:3px solid var(--blue);transform:rotate(45deg);transition:transform .2s}
.guide[open] summary::after{transform:rotate(-135deg)}
.guide ol,.guide ul{padding-inline-start:22px;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.guide .ex{margin-top:14px;font-size:15px;opacity:.9;border-top:3px solid var(--frame);padding-top:12px}
.l{display:block;font-weight:700;font-size:16px;margin:0 0 6px}
.in{width:100%;background:var(--page);border:0;border-radius:14px;padding:12px 16px;color:var(--blue);outline:none;line-height:1.45;resize:none;display:block}
.in::placeholder{color:var(--blue2);opacity:.65}
.in:focus-visible{outline:2px solid var(--blue)}
textarea.in{overflow:hidden;min-height:48px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--blue) 50%),linear-gradient(135deg,var(--blue) 50%,transparent 50%);background-position:18px 52%,24px 52%;background-size:6px 6px;background-repeat:no-repeat;padding-inline-start:40px}
.btn{border:0;border-radius:999px;padding:10px 22px;font-weight:600;background:var(--page);color:var(--blue);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;line-height:1.2}
.btn:hover{background:var(--blue);color:var(--on)}
.btn:focus-visible,.sb:focus-visible,.tbtn:focus-visible,.node:focus-visible,.seg button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn.pri{background:var(--blue);color:var(--on)}
.btn.pri:hover{background:var(--blue2)}
.btn.pur{background:var(--purple);color:var(--on)}
.btn.lt{background:var(--frame);color:var(--blue)}
.btn.sm{padding:6px 14px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:hover{background:var(--page);color:var(--blue)}
.addrow{display:flex;gap:10px;margin-top:14px}
.rm{border:0;background:transparent;color:var(--blue);width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;flex:0 0 34px;padding:0}
.rm:hover{background:var(--purple);color:var(--on)}
.list{display:flex;flex-direction:column;gap:10px}
.item,.idea,.card,.path,.guide li{overflow-wrap:anywhere}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--page);border-radius:14px;padding:8px 8px 8px 12px}
.item .in{background:transparent;padding:8px 10px}
.item.sel{background:var(--blue);color:var(--on)}
.item.sel .in{color:var(--on)}
.item.sel .by{color:var(--on)}
.item.sel .rm{color:var(--on)}
.item.sel .in::placeholder{color:var(--on)}
.by{font-size:13px;opacity:.78;padding:0 10px 4px}
.radio{width:28px;height:28px;border-radius:50%;background:var(--frame);border:0;flex:0 0 28px;margin-top:10px;display:grid;place-items:center;padding:0}
.item.sel .radio::after{content:'';width:14px;height:14px;border-radius:50%;background:var(--blue)}
.empty{background:var(--page);border-radius:14px;padding:22px;text-align:center;font-weight:500}
.empty b{display:block;font-size:18px;margin-bottom:2px}
.seg{display:inline-flex;background:var(--page);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.item .seg,.card .seg{background:var(--frame)}
.seg button{border:0;border-radius:999px;background:transparent;padding:5px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.seg button.on{background:var(--blue);color:var(--on)}
.seg.t button.on{background:var(--purple)}
.seg button.on.w{background:var(--purple)}
.card{background:var(--page);border-radius:var(--R);padding:20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--R)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--R)}
.stat{background:var(--page);border-radius:var(--R);padding:16px 20px}
.stat{min-width:0}
.stat b{font-size:40px;font-weight:900;line-height:1;display:block}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700;background:var(--blue);color:var(--on)}
.pill.p{background:var(--purple)}
.pill.d{background:var(--blue2)}
.pill.l{background:var(--page);color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chp{border:0;border-radius:999px;background:var(--frame);padding:5px 14px;font-size:14px;font-weight:600;color:var(--blue)}
.chp.on{background:var(--blue);color:var(--on)}
.notice{border-radius:var(--R);padding:14px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-weight:500}
.notice.deep{background:var(--blue2);color:var(--on)}
.notice.purple{background:var(--purple);color:var(--on)}
.notice .btn{background:var(--on);color:var(--blue)}
.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.nav .btn{white-space:normal;text-align:start}
.loading{display:grid;place-items:center;min-height:260px;font-size:20px;font-weight:600}

/* ---- tree ---- */
.tree-scroll{overflow-x:auto;padding:6px 2px 12px;margin:0 -2px}
.tree{width:max-content;min-width:100%;display:flex;flex-direction:column;align-items:center}
.zone{display:flex;gap:12px;justify-content:center;width:100%}
.zone.cons{align-items:flex-end}
.zone.causes{align-items:flex-start}
.cap{width:100%;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;margin:10px 0}
.cap::before,.cap::after{content:'';height:3px;flex:1;background:var(--page);border-radius:3px}
.col{display:flex;flex-direction:column;width:204px;flex:0 0 204px}
.zone.cons .col{flex-direction:column-reverse}
.link{width:3px;height:16px;background:var(--sky);margin:0 auto;border-radius:2px;flex:0 0 16px}
.link.on{background:var(--blue);width:5px}
.node{position:relative;border-radius:14px;background:var(--page);padding:10px 12px 10px;min-height:62px;color:var(--blue)}
.node .tag{display:block;font-size:13px;font-weight:700;margin-bottom:2px}
.node.c .tag{color:var(--purple)}
.node.k .tag{color:var(--blue2)}
.node .in{background:transparent;padding:2px 0;border-radius:6px;font-size:16px;min-height:26px}
.node .in:focus-visible{outline-offset:3px}
.node .x{position:absolute;inset-block-start:6px;inset-inline-end:6px;border:0;background:transparent;color:var(--blue);width:24px;height:24px;border-radius:50%;font-size:18px;line-height:1;padding:0;opacity:.0}
.node:hover .x,.node:focus-within .x{opacity:1}
.node .x:hover{background:var(--purple);color:var(--on)}
.node.pick{cursor:pointer}
.node.pick:hover{outline:2px solid var(--blue)}
.node.on.c{background:var(--purple);color:var(--on)}
.node.on.k{background:var(--blue2);color:var(--on)}
.node.on .tag{color:var(--on)}
.node.on .in{color:var(--on)}
.node.dim{opacity:.4}
.addn{border:0;border-radius:14px;background:var(--page);padding:8px;font-size:14px;font-weight:600;color:var(--blue)}
.addn:hover{background:var(--blue);color:var(--on)}
.addc{align-self:flex-start;width:92px;flex:0 0 92px;border:0;border-radius:14px;background:var(--page);font-weight:700;font-size:14px;color:var(--blue);padding:8px;min-height:62px}
.addc:hover{background:var(--blue);color:var(--on)}
.trunk{margin:2px 0;width:min(580px,92%);min-width:300px;border-radius:var(--R);padding:16px 22px;background:var(--blue);color:var(--on);text-align:center}
.trunk .tag{font-size:13px;font-weight:700;display:block;margin-bottom:2px}
.trunk .tx{font-weight:800;font-size:20px;line-height:1.3}
.trunk.empty-t{background:var(--page);color:var(--blue)}
.tree.mini .col{width:156px;flex-basis:156px}
.tree.mini .node{padding:8px 10px;min-height:46px;font-size:14px}
.tree.mini .node .tx{font-size:14px;line-height:1.35}

/* ---- paths ---- */
.path{background:var(--page);border-radius:var(--R);padding:20px;margin-bottom:var(--R)}
.path.chosen{background:var(--blue);color:var(--on)}
.path.chosen .in{background:var(--frame);color:var(--blue)}
.path.chosen .crit{background:var(--blue2)}
.path .ph{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.path .nm{width:44px;height:44px;border-radius:50%;background:var(--blue);color:var(--on);font-weight:900;font-size:20px;display:grid;place-items:center;flex:0 0 44px}
.path.chosen .nm{background:var(--on);color:var(--blue)}
.path .pl{flex:1;min-width:230px;font-size:17px}
.path .pl em{font-style:normal;font-weight:800}
.crits{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.crit{background:var(--frame);border-radius:14px;padding:14px;color:var(--blue)}
.crit h4{font-size:16px;font-weight:700}
.crit .d{font-size:14px;opacity:.85;margin:2px 0 8px;min-height:40px}
.crit .in{margin-top:8px;font-size:15px}
.path.chosen .crit{color:var(--on)}
.path.chosen .crit .seg{background:var(--blue)}
.path.chosen .crit .seg button{color:var(--on)}
.path.chosen .crit .seg button.on{background:var(--on);color:var(--blue)}
.path.chosen .crit .in{background:var(--on)}

/* ---- definition ---- */
.defbox{background:var(--blue);color:var(--on);border-radius:var(--R);padding:28px 30px}
.defbox .sent{font-size:clamp(22px,2.6vw,30px);font-weight:500;line-height:1.7}
.defbox .p{display:inline;padding:3px 12px;border-radius:12px;font-weight:700;background:var(--on);color:var(--blue);box-decoration-break:clone}
.defbox .p.a{background:var(--purple);color:var(--on)}
.defbox .p.c{background:var(--blue2);color:var(--on);outline:2px solid var(--on)}
.defbox .op{font-weight:800;margin:0 6px}
.defbox .ph{opacity:.6;font-weight:400}

/* ---- ideas ---- */
.pinned{position:sticky;top:var(--R);z-index:5}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:var(--R)}
.idea{background:var(--page);border-radius:var(--R);padding:16px;display:flex;flex-direction:column;gap:12px}
.idea.star{background:var(--purple);color:var(--on)}
.idea.star .in{color:var(--on)}
.idea.star .in::placeholder{color:var(--on)}
.idea.star .rm{color:var(--on)}
.idea .in{background:transparent;padding:4px 2px;font-weight:600;font-size:18px}
.idea .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.vote{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--frame);padding:4px 16px 4px 6px;font-weight:700;color:var(--blue)}
.vote.me{background:var(--blue);color:var(--on)}
.vote .n{background:var(--blue);color:var(--on);min-width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px}
.vote.me .n{background:var(--on);color:var(--blue)}
.lv{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:0;font-size:14px;font-weight:600;color:inherit}
.lv i{display:inline-block;width:16px;height:8px;border-radius:4px;background:var(--frame)}
.lv i.on{background:var(--blue)}
.idea.star .lv i{background:var(--blue2)}
.idea.star .lv i.on{background:var(--on)}
.idea.star .vote{background:var(--on)}
.idea.star .vote.me{background:var(--blue)}
.board h3.s{margin:26px 0 10px}
.board .q{font-size:clamp(26px,3.4vw,40px);font-weight:900;line-height:1.1}

@media (max-width:980px){
  .main{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:20;padding:8px;max-height:none;overflow:visible;border-radius:var(--R)}
  .side .grp,.side .prog,.roles2{display:none}
  .side nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
  .side nav::-webkit-scrollbar{display:none}
  .sb{flex-direction:column;flex:0 0 auto;width:auto;min-width:84px;gap:4px;font-size:13px;text-align:center;padding:8px 8px;align-items:center}
  .sb .nm{flex:0 0 auto;max-width:92px;line-height:1.2}
  .sb{position:relative}
  .sb .pin{display:none}
  .sb .pin.cnt{display:grid;position:absolute;top:2px;inset-inline-end:4px;min-width:22px;height:22px;padding:0 6px;place-items:center}
  .hero .copy{padding:30px 24px 64px;min-height:0}
  .hero .photo{min-height:220px}
  .dot{width:118px;height:118px;font-size:14px;padding:16px}
  .grid2{grid-template-columns:1fr}
  .fr{padding:20px}
  :root{--R:16px;--pad:20px}
  .top{padding:12px 16px;gap:12px}
  .top .name small{display:none}
  .top-save span{display:none}
  .top-save{padding:8px 10px}
  .pinned{position:static}
  .nav{position:sticky;bottom:0;z-index:15;margin:0 calc(-1 * var(--R));padding:12px var(--R) calc(12px + env(safe-area-inset-bottom,0px));background:var(--page)}
}
@media (max-width:760px){
  .grid3{grid-template-columns:1fr}
  .stats3,.grid3.stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .fr{padding:18px}
  :root{--R:14px;--pad:18px}
  .tbtn{height:40px}
  .timer .tbtn[data-act=tAdd]{display:none}
  .patw{display:none}
  .addc{align-self:stretch}
  h2.t{font-size:28px}
  .sh{gap:12px}
  .sh .num{flex-basis:48px;height:48px}
  .sh p{font-size:17px}
  .top .logo{height:30px}
  .timer{padding:4px 6px 4px 10px;gap:6px}
  .timer .t{font-size:19px;min-width:56px}
  /* עץ אנכי בנייד: בלי גלילה צידית */
  .tree-scroll{overflow-x:visible}
  .tree{width:100%}
  .zone{flex-direction:column;align-items:stretch;gap:18px}
  .col{width:100%;flex:0 0 auto}
  .zone.cons .col{flex-direction:column-reverse}
  .addc{width:100%;flex:0 0 auto;min-height:48px}

/* ---------- 3 · תובנות והנחות ---------- */
function insightsHTML() {
  const s = STEPS[3], ins = list('insights');

  return stepHead(s, 'מתבוננים בעץ ומחלצים את ההנחות') +
  `${how(['רשמו מה אתם רואים בעץ', 'חלצו את הנחת היסוד שמאחורי כל תובנה', 'סווגו אותה והחליטו מה עושים איתה'],
    ['שאלו אחד את השנייה: <b>מה הנחת היסוד שעומדת מאחורי מה שאמרת?</b> האם זו דעתך, או שהיא מגובה במחקר?', '<b>מוכחת:</b> מבוססת נתונים. <b>השערה:</b> אינה מגובה בנתונים, ולכן אוספים נתונים לתיקוף. <b>ערכית:</b> מגדירה מה חשוב לנו, ואותה לא מוכיחים.', 'מקורות לנתונים: מומחים, בעלי עניין, האינטרנט, נתוני הארגון וארגונים דומים.', 'החלטה: עובדים איתה, בודקים קודם, או זונחים.'])}
  <div class="grid3 stats"><div class="stat"><b>${cnt('proven')}</b>הנחות מוכחות</div><div class="stat"><b>${cnt('hyp')}</b>השערות לתיקוף</div><div class="stat"><b>${cnt('value')}</b>הנחות ערכיות</div></div>
  ${ins.length ? ins.map((x, i) => insightCard(x, i)).join('') : `<section class="fr">${emptyBox('עוד לא נרשמו תובנות', 'התחילו מהשאלה: מה אנחנו רואים בעץ?')}</section>`}
  <section class="fr"><h3 class="s">תובנה חדשה</h3><p class="hint" style="margin:4px 0 0">מה עולה בקבוצה כשמסתכלים בעץ?</p>${addRow('insights', 'מה אנחנו רואים בעץ?')}</section>`;

function insightCard(x, i) {

    <label class="l" style="margin-top:16px">הנחת היסוד שעומדת מאחורי זה</label>${ta('insights', x.id, 'assumption', 'מה מניחים כאן?')}

      <div><div class="hint" style="margin-bottom:6px">מה עושים איתה?</div><div class="seg w">${Object.entries(DECISIONS).map(([k, v]) => `<button class="${dec === k ? 'on' : ''}" data-act="iset" data-id="${x.id}" data-f="decision" data-v="${k}">${v}</button>`).join('')}</div></div></div>
    <p class="hint" style="margin-top:14px">${hint}</p>

}

/* ---------- 4 · נתיב קריטי ---------- */
function hlOf(ids) { return { ids: new Set(ids) }; }
function pathHTML() {
  const s = STEPS[4], pk = S.pick;
  const okC = pk.c && nodeById(pk.c), okK = pk.k && nodeById(pk.k);
  const ids = [...(okC ? chainTo(pk.c) : []), ...(okK ? chainTo(pk.k) : [])].map(n => n.id);
  const paths = list('paths'), ch = curPath();
  const outRoots = [];
  if (ch) { const T = treeModel(); const cc = nodeById(ch.causeNode).col, kc = nodeById(ch.consNode).col; T.c.forEach(c => { if (c.root.id !== cc) outRoots.push(['גורם', V('nodes', c.root.id, 'text')]); }); T.k.forEach(c => { if (c.root.id !== kc) outRoots.push(['השלכה', V('nodes', c.root.id, 'text')]); }); }
  return stepHead(s, 'במה משקיעים, ובעיקר במה לא') +
  `${how(['סמנו על העץ גורם והשלכה', 'השוו נתיבים לפי ארבעה שיקולים', 'בחרו נתיב אחד ותעדו מה נשאר בחוץ'],
    ['הנתיב עובר מהגורם דרך התופעה אל ההשלכה שבה נטפל. אפשר לסמן כמה נתיבים ואז לבחור.', '<b>שיקולים:</b> נתונים · משקל הנתיב (סיכויי הצלחה, השקעה מול תועלת) · המקום שלנו (תשוקה, אנרגיה, ערכים, מגבלות) · השדה (תומכים, ווטו, שותפים).', 'זה שלב קשה. אם לא נתעסק בחלק מהדברים, אנחנו לא נהיה שם.'])}
  <section class="fr"><h3 class="s">סמנו נתיב על העץ</h3><p class="hint" style="margin:4px 0 12px">לחצו על צומת גורם (בכל עומק) ואז על צומת השלכה. הקו עובר דרך התופעה.</p>
    ${treeHTML('pick', hlOf(ids))}
    <div class="row" style="margin-top:8px"><span class="grow">${okC && okK ? `נבחר: <b>${esc(nodeText(pk.c))}</b> ${ar()} התופעה ${ar()} <b>${esc(nodeText(pk.k))}</b>` : `<span class="hint">בחרו ${!okC ? 'גורם' : ''}${!okC && !okK ? ' ו' : ''}${!okK ? 'השלכה' : ''} כדי להוסיף נתיב</span>`}</span>
      <button class="btn pri w" data-act="addPath" ${okC && okK && paths.length < 4 ? '' : 'disabled'}>הוספת נתיב להשוואה</button></div></section>
  <h3 class="s" style="padding:0 6px">הנתיבים שמשווים ביניהם</h3>
  ${paths.length ? `<div>${paths.map((p, i) => pathCard(p, i)).join('')}</div>` : `<section class="fr">${emptyBox('עוד לא נוסף נתיב', 'סמנו על העץ גורם והשלכה, והוסיפו את הנתיב להשוואה.')}</section>`}
  ${ch ? `<section class="fr"><h3 class="s">מה נשאר בחוץ?</h3><p class="hint" style="margin:4px 0 12px">בחירה בנתיב היא גם בחירה במה לא לעשות עכשיו. כך נראה מה נשאר מחוץ לנתיב:</p>
    <div class="chips">${outRoots.length ? outRoots.map(([k, t]) => `<span class="chip">${k} · ${esc(t || '')}</span>`).join('') : '<span class="hint">כל העץ בתוך הנתיב</span>'}</div>
    <label class="l" style="margin-top:16px">תיעוד: במה אנחנו בוחרים לא להשקיע?</label>${ta('meta', 'session', 'skip', 'מה משאירים בצד, ולמה?')}</section>` : ''}`;
}
function pathCard(p, i) {
  const ok = pathOk(p), chosen = p.id === M('chosenPath'), rate = p.rate || {};
  const strong = CRIT.filter(([k]) => (V('paths', p.id, 'rate.' + k) || '') === 's').length;
  return `<div class="path ${chosen ? 'chosen' : ''}"><div class="ph"><div class="nm">${LET[i]}</div>
    <div class="pl">${ok ? `<em>${esc(nodeText(p.causeNode))}</em> ${ar(chosen ? 'white' : 'blue')} התופעה ${ar(chosen ? 'white' : 'blue')} <em>${esc(nodeText(p.consNode))}</em>` : 'הנתיב מתייחס לצומת שנמחק מהעץ'}<div class="hint">${strong} מתוך 4 שיקולים חזקים${chosen ? ' · הנתיב הקריטי שנבחר' : ''}</div></div>
    <div class="row w"><button class="btn sm ${chosen ? 'lt' : 'pri'}" data-act="choosePath" data-id="${p.id}" ${ok ? '' : 'disabled'}>${chosen ? `הנתיב הנבחר ${ic('check', 'blue', 16)}` : 'בחרו נתיב זה'}</button>${ok ? `<button class="btn sm lt" data-act="showPath" data-id="${p.id}">הצגה על העץ</button>` : ''}<button class="rm" data-act="rmPath" data-id="${p.id}" aria-label="מחיקה" style="${chosen ? 'color:var(--on)' : ''}">×</button></div></div>
    <div class="crits">${CRIT.map(([k, name, d]) => { const r = V('paths', p.id, 'rate.' + k) || ''; return `<div class="crit"><h4>${name}</h4><div class="d">${d}</div>
      <div class="seg w">${[['s', 'חזק'], ['m', 'בינוני'], ['w', 'חלש']].map(([v, t]) => `<button class="${r === v ? 'on' : ''}" data-act="rate" data-id="${p.id}" data-k="${k}" data-v="${v}">${t}</button>`).join('')}</div>
      ${ta('paths', p.id, 'notes.' + k, 'השיקול שעלה')}</div>`; }).join('')}</div></div>`;
}

/* ---------- 6 · רעיונות ---------- */

/* ---------- לוח למליאה ---------- */

    const inp = $('[data-addin]', el.closest('.addrow')); const v = inp.value.trim(); if (!v) { inp.focus(); return; }
    const kind = e.kind; const data = { text: v };
    if (kind === 'insights') Object.assign(data, { assumption: '', type: 'hyp', decision: 'check', sources: {} });
    if (kind === 'assumptions') data.type = 'hyp';
    inp.value = ''; S.focus = kind;
    const id = await add(ADDCOL[kind], data);
    if (kind === 'phens' && id && !M('chosenPhen')) patch('meta', 'session', { chosenPhen: id }, 0);
  },
  async gapToPhen(e) { const t = V('gaps', e.id, 'text'); if (!t) return; const id = await add('phens', { text: t }); if (id && !M('chosenPhen')) patch('meta', 'session', { chosenPhen: id }, 0); toast('נוסף לרשימת התופעות'); },
  rm(e) { removeDoc(e.col, e.id); },
  choosePhen(e) { patch('meta', 'session', { chosenPhen: e.id }, 0); },
  rmPhen(e) { removeDoc('phens', e.id); if (M('chosenPhen') === e.id) patch('meta', 'session', { chosenPhen: null }, 0); },
  async addCol(e) { const ref = DB.collection('nodes').doc(); S.focus = `nodes/${ref.id}/text`; try { await ref.set({ kind: e.k, col: ref.id, depth: 0, text: '', by: ME.id, ord: Date.now() }); } catch (er) { writeError(er); } },
  async addNode(e) {
    const col = list('nodes').filter(n => n.col === e.col); const depth = Math.max(...col.map(n => n.depth)) + 1;
    const ref = DB.collection('nodes').doc(); S.focus = `nodes/${ref.id}/text`;
    try { await ref.set({ kind: e.k, col: e.col, depth, text: '', by: ME.id, ord: Date.now() }); } catch (er) { writeError(er); }
  },
  delNode(e) { const n = nodeById(e.id); if (!n) return; list('nodes').filter(x => x.col === n.col && x.depth >= n.depth).forEach(x => removeDoc('nodes', x.id)); S.pick = { c: null, k: null }; },
  pick(e) { S.pick[e.k] = e.id; render(); },
  async addPath() {
    const p = S.pick; if (!p.c || !p.k) return;
    await add('paths', { causeNode: p.c, consNode: p.k, rate: {}, notes: {} }); S.pick = { c: null, k: null }; toast('הנתיב נוסף להשוואה');
  },
  showPath(e) { const p = D.paths[e.id]; S.pick = { c: p.causeNode, k: p.consNode }; render(); scrollTo(0, 0); },
  rmPath(e) { removeDoc('paths', e.id); if (M('chosenPath') === e.id) patch('meta', 'session', { chosenPath: null }, 0); },
  choosePath(e) { patch('meta', 'session', { chosenPath: e.id }, 0); const p = D.paths[e.id]; syncDef(p); toast('הנתיב הקריטי נבחר וההגדרה מולאה'); },
  rate(e) { const cur = V('paths', e.id, 'rate.' + e.k); patch('paths', e.id, { rate: { [e.k]: cur === e.v ? '' : e.v } }, 0); },
  syncDef() { const c = curPath(); if (c) syncDef(c); },
  iset(e) { patch('insights', e.id, { [e.f]: e.v }, 0); },
  isrc(e) { const cur = (V('insights', e.id, 'sources') || {})[e.v]; patch('insights', e.id, { sources: { [e.v]: !cur } }, 0); },
  aset(e) { patch('assumptions', e.id, { type: e.v }, 0); },
  async importAssump() {
    let n = 0; const have = list('assumptions').map(a => V('assumptions', a.id, 'text')); let cnt = have.length;
    for (const x of list('insights')) { const t = V('insights', x.id, 'assumption'); if (t && V('insights', x.id, 'decision') !== 'drop' && cnt < 4 && !have.includes(t)) { await add('assumptions', { text: t, type: V('insights', x.id, 'type') || 'hyp' }); have.push(t); cnt++; n++; } }
    toast(n ? `יובאו ${n} הנחות מהתובנות` : 'אין הנחות חדשות לייבוא');
  },
  genHmw() { patch('meta', 'session', { hmw: `איך נוכל לטפל בכך ש${M('def.cause') || '…'}, כך שהתופעה ״${M('def.phen') || '…'}״ תצטמצם?` }, 0); },
  dTarget(e) { S.draftIdea.text = $('#ideaText').value; S.draftIdea.assum = $('#ideaAssum').value; S.draftIdea.target = e.v; render(); },
  async addIdea() {
    const text = $('#ideaText').value.trim(); if (!text) { $('#ideaText').focus(); return; }
    const d = S.draftIdea; const assum = $('#ideaAssum').value;
    S.draftIdea = { text: '', target: d.target, assum: '' };
    await add('ideas', { text, target: d.target, assum, effort: 1, impact: 1, star: false }); toast('הרעיון נוסף');
  },
  vote(e) { patch('votes', e.id + '_' + ME.id, { idea: e.id, uid: ME.id, v: !iVoted(e.id) }, 0); },
  star(e) { patch('ideas', e.id, { star: !V('ideas', e.id, 'star') }, 0); },
  cycle(e) { patch('ideas', e.id, { [e.f]: ((V('ideas', e.id, e.f) ?? 1) + 1) % 3 }, 0); },
  sortIdeas(e) { S.ideaSort = e.v; render(); },
  copyText() {
    const t = boardText(); const ok = () => toast('הועתק ללוח'), fail = () => toast('ההעתקה נחסמה בדפדפן. אפשר לשמור כקובץ');
    try { navigator.clipboard.writeText(t).then(ok, fail); } catch (e) { fail(); }
  },
  printDoc() { printDoc(); },
  saveHtml() { saveFile(fileStem() + '.html', reportHTML(), 'text/html'); },
  saveDoc() { saveFile(fileStem() + '.doc', reportHTML({ word: true }), 'application/msword'); },
  saveText() { saveFile(fileStem() + '.txt', boardText(), 'text/plain'); },
  openExport() { S.step = STEPS.length - 1; lsSet(WS_KEY, S.step); render(); scrollTo(0, 0); },
  tToggle: () => timerAct('tToggle'), tReset: () => timerAct('tReset'), tAdd: e => timerAct('tAdd', +e.n)
};
function syncDef(p) {
  if (!p || !nodeById(p.causeNode) || !nodeById(p.consNode)) return;
  patch('meta', 'session', { def: { cause: nodeText(p.causeNode), phen: phenText(), cons: nodeText(p.consNode) } }, 0);
}

/* ---------- אירועים ---------- */
document.addEventListener('pointerdown', () => { pointerDown = true; });
document.addEventListener('pointerup', () => { pointerDown = false; });
document.addEventListener('pointercancel', () => { pointerDown = false; });
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (RO && el.closest('.w')) return;
  const f = ACT[el.dataset.act]; if (f) f(el.dataset, el);
});
document.addEventListener('keydown', ev => {
  const t = ev.target;
  if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter' && t.matches && t.matches('[data-addin="sugg"]')) { ev.preventDefault(); ACT.addSugg(); return; }
  if (ev.key === 'Enter' && t.tagName === 'INPUT' && t.matches && t.matches('[data-addin]')) { ev.preventDefault(); $('[data-act="add"]', t.closest('.addrow')).click(); }
  if ((ev.key === 'Enter' || ev.key === ' ') && t.matches && t.matches('.node.pick')) { ev.preventDefault(); t.click(); }
  if (ev.key === 'Enter' && !ev.shiftKey && t.matches && t.matches('textarea[data-f]') && !t.classList.contains('big') && !t.closest('.guide')) { ev.preventDefault(); t.blur(); }
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.id === 'ideaText') { S.draftIdea.text = el.value; autosize(el); return; }
  if (el.dataset && el.dataset.addin === 'sugg') { S.draftSugg.text = el.value; autosize(el); return; }
  if (!el.dataset || !el.dataset.f) return;
  patch(el.dataset.col, el.dataset.id, nest(el.dataset.f, el.value));
  autosize(el);
  if (el.dataset.f.startsWith('def.')) { const d = $('.defbox .sent'); if (d) d.innerHTML = defSentence(); }
});
document.addEventListener('change', ev => { const el = ev.target; if (el.dataset && el.dataset.sugcol) S.adoptCol[el.dataset.sugcol] = el.value; });
document.addEventListener('toggle', ev => { const d = ev.target; if (!d.classList) return; if (d.classList.contains('more')) S.gc[STEPS[S.step].id] = d.open; if (d.classList.contains('guide')) S.gx[STEPS[S.step].id] = d.open; }, true);
addEventListener('resize', () => $$('textarea').forEach(autosize));

/* ---------- אתחול ---------- */
(async function boot() {
  try { HOST = await window.MHI_HOST; }
  catch (e) { $('#app').innerHTML = '<div class="fr loading">לא מצאנו את הצוות הזה. חזרו לדף ״הובלת יוזמה״ באפליקציה.</div>'; return; }
  USER = { profiles: async ids => Object.fromEntries(ids.map(i => [i, { name: HOST.names[i] || '' }])) };
  DB = HOST.db; LOCAL = HOST.local;
  ME = { id: HOST.me.id, name: HOST.me.name };
  if (LOCAL) { RO = false; FILLER = true; } else { CANSUG = HOST.canWrite; if (!HOST.isRoster) { FILLER = false; RO = true; } }
  if (HOST.step) { const i = STEPS.findIndex(x => x.id === HOST.step); if (i >= 0) { S.step = i; S.follow = false; } }
  S.ready = true;
  COLS.forEach(col => {
    DB.collection(col).onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); }); D[col] = m;
      S.got[col] = true; if (!S.loaded && COLS.every(c => S.got[c])) S.loaded = true;
      if (col === 'meta') onMeta();
      scheduleRender();
    }, err => { if (err && err.code === 'permission-denied') { RO = true; FILLER = false; S.got[col] = true; if (COLS.every(c => S.got[c])) S.loaded = true; scheduleRender(); } });
  });
  setTimeout(() => { if (!S.loaded) { S.loaded = true; scheduleRender(); } }, 3000);
})();
</script>
